[workspace]
name = "openwrt-feed"
version = "0.1.0"
description = "OpenWrt 21.02 arm64-musl package feed: prebuilt artifacts, no cross toolchain"
channels = ["conda-forge"]
platforms = ["linux-64"]

# The packaging flow itself is plain Makefile + POSIX shell; no language
# runtime is needed. Only the tools that the host image lacks are declared
# here: GNU make and binutils (`ar` is required by opkg-build to write the
# ipk outer archive).
[dependencies]
make = "4.*"
binutils = "*"

[tasks]
build = "make"
clean = "make clean"
distclean = "make distclean"
verify = "make verify"
smoke = "sh scripts/smoke-arm64.sh"
